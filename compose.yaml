name: easyfood

x-app-image: &app-image
  image: easyfood:local
  build:
    context: .
  init: true

x-database-url: &database-url "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-easyfood}"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-easyfood}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    <<: *app-image
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-image
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: *database-url
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env antes de iniciar}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_API_KEY: ${EMAIL_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-EasyFood}
      EMAIL_TO: ${EMAIL_TO:-}
      SEED_USER_EMAIL: ${SEED_USER_EMAIL:-demo@easyfood.local}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-easyfood123}
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
  uploads:
